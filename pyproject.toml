[project]
name = "porcipeso"
version = "0.1.0"
description = "Sistema de pesaje porcino por lote sobre indicadores seriales (RS-232/RS-485/TCP)"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pyserial",
  "pyyaml",
  "openpyxl",
  "httpx",
  "reportlab",
]

[project.optional-dependencies]
# playwright: tests e2e de la UI real (tests/e2e/test_ui_playwright.py y
# tests/e2e/test_ui_conexion.py); si el paquete o el navegador faltan,
# esas suites se saltan solas (importorskip).
dev = ["pytest", "httpx", "websockets", "playwright"]
build = ["pillow", "pyinstaller"]
# Servidor nube (porcipeso.cloud): JWT + hashing Argon2id.
# argon2-cffi elegido sobre passlib[bcrypt]: passlib está sin
# mantenimiento y falla en Python 3.13+; argon2id es el estándar OWASP.
cloud = ["pyjwt", "argon2-cffi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["porcipeso*"]
