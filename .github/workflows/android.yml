# PorciPeso — APK Android (Capacitor)
#
# El APK se compila SOLO en CI (no hay Android SDK local). Dispara:
#   - manualmente (workflow_dispatch), o
#   - al pushear un tag v* (p. ej. v0.1.0).
# Artifact resultante: porcipeso-debug-apk (app-debug.apk instalable).
name: android-apk

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Java 17 (Gradle / AGP de Capacitor 6)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Tests (paridad engine + parsers + apishim)
        run: npm test

      - name: Build webapp (www/ = UI + shim embebido)
        run: npm run build

      - name: Capacitor sync
        run: npx cap sync android

      - name: Compilar APK debug
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: porcipeso-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

