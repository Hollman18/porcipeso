name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: PorciPeso-macos
          - os: windows-latest
            artifact: PorciPeso-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r packaging/requirements-build.txt
          pip install -e . --no-deps

      - name: Construir con PyInstaller
        run: pyinstaller packaging/porcipeso.spec --noconfirm

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          PORCIPESO_NO_BROWSER=1 PORCIPESO_PORT=8765 ./dist/PorciPeso.app/Contents/MacOS/PorciPeso &
          SERVER_PID=$!
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8765/api/profiles > /dev/null && break
            sleep 1
          done
          curl -sf -o /dev/null -w "profiles: %{http_code}\n" http://127.0.0.1:8765/api/profiles
          curl -sf -o /dev/null -w "root: %{http_code}\n" http://127.0.0.1:8765/
          kill -TERM $SERVER_PID

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PORCIPESO_NO_BROWSER = "1"
          $env:PORCIPESO_PORT = "8765"
          $proc = Start-Process -FilePath "dist\PorciPeso\PorciPeso.exe" -PassThru
          $ok = $false
          foreach ($i in 1..60) {
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8765/api/profiles" -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $ok) { Stop-Process -Id $proc.Id -Force; throw "El servidor no respondio" }
          $root = Invoke-WebRequest -Uri "http://127.0.0.1:8765/" -UseBasicParsing
          Write-Host "profiles: 200  root: $($root.StatusCode)"
          Stop-Process -Id $proc.Id -Force

      - name: Empaquetar zip (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/PorciPeso.app dist/PorciPeso-macos.zip

      - name: Empaquetar zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\PorciPeso -DestinationPath dist\PorciPeso-windows.zip

      - name: Instalador Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\installer.iss

      - name: Subir artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/PorciPeso-macos.zip
            dist/PorciPeso-windows.zip
            dist/PorciPeso-Setup.exe
          if-no-files-found: error
