# PorciPeso — builds de escritorio (PyInstaller)
#
# Versionado: la fuente única es el archivo VERSION de la raíz (env
# PORCIPESO_VERSION). En tags v* los binarios se renombran con la versión
# y un job final los adjunta al GitHub Release del tag.
name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write # crear/actualizar el GitHub Release en tags

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: PorciPeso-macos
          - os: windows-latest
            artifact: PorciPeso-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Versión (archivo VERSION -> env)
        shell: bash
        run: |
          VERSION="$(tr -d ' \n' < VERSION)"
          echo "PORCIPESO_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PorciPeso v$VERSION"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r packaging/requirements-build.txt
          pip install -e . --no-deps

      - name: Construir con PyInstaller
        run: pyinstaller packaging/porcipeso.spec --noconfirm

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          PORCIPESO_NO_BROWSER=1 PORCIPESO_PORT=8765 ./dist/PorciPeso.app/Contents/MacOS/PorciPeso &
          SERVER_PID=$!
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8765/api/profiles > /dev/null && break
            sleep 1
          done
          curl -sf -o /dev/null -w "profiles: %{http_code}\n" http://127.0.0.1:8765/api/profiles
          curl -sf -o /dev/null -w "root: %{http_code}\n" http://127.0.0.1:8765/
          kill -TERM $SERVER_PID

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PORCIPESO_NO_BROWSER = "1"
          $env:PORCIPESO_PORT = "8765"
          $proc = Start-Process -FilePath "dist\PorciPeso\PorciPeso.exe" -PassThru
          $ok = $false
          foreach ($i in 1..60) {
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8765/api/profiles" -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $ok) { Stop-Process -Id $proc.Id -Force; throw "El servidor no respondio" }
          $root = Invoke-WebRequest -Uri "http://127.0.0.1:8765/" -UseBasicParsing
          Write-Host "profiles: 200  root: $($root.StatusCode)"
          Stop-Process -Id $proc.Id -Force

      - name: Empaquetar zip (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/PorciPeso.app "dist/PorciPeso-macos-v${PORCIPESO_VERSION}.zip"

      - name: Empaquetar zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\PorciPeso -DestinationPath "dist\PorciPeso-windows-v$env:PORCIPESO_VERSION.zip"

      - name: Instalador Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:PORCIPESO_VERSION" packaging\installer.iss
          Rename-Item -Path "dist\PorciPeso-Setup.exe" -NewName "PorciPeso-Setup-v$env:PORCIPESO_VERSION.exe"

      - name: Subir artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/PorciPeso-macos-v*.zip
            dist/PorciPeso-windows-v*.zip
            dist/PorciPeso-Setup-v*.exe
          if-no-files-found: error

  # Solo en tags v*: adjunta los binarios al GitHub Release del tag.
  # (El APK Android lo adjunta android.yml al MISMO release.)
  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Descargar artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Crear/actualizar GitHub Release con los binarios
        uses: softprops/action-gh-release@v2
        with:
          name: PorciPeso ${{ github.ref_name }}
          files: |
            dist/PorciPeso-Setup-v*.exe
            dist/PorciPeso-macos-v*.zip
            dist/PorciPeso-windows-v*.zip
          fail_on_unmatched_files: true
