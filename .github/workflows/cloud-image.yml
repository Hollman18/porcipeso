# Publica la imagen del servidor nube (Dockerfile.cloud) a ghcr en cada
# push a main que toque el código del cloud, y bajo demanda.
name: cloud-image

on:
  push:
    branches: [main]
    paths:
      - "porcipeso/cloud/**"
      - "Dockerfile.cloud"
      - ".github/workflows/cloud-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login a ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push linux/amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cloud
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/hollman18/porcipeso-cloud:latest
            ghcr.io/hollman18/porcipeso-cloud:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
